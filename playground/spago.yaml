package:
  name: tramaj-playground
  # A browser app, so it depends on `tramaj-halogen` (and therefore on
  # `tramaj` transitively) — unlike `tramaj-cli`, which only ever
  # produces the generic `Node` AST and stays halogen-free.
  dependencies:
    - prelude
    - aff
    - argonaut-core
    - arrays
    - effect
    - either
    - halogen
    - maybe
    - strings
    - tramaj
    - tramaj-halogen
  bundle:
    module: Playground.Main
    platform: browser
    type: app
    outfile: dist/app.js
