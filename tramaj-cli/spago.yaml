package:
  name: tramaj-cli
  # Deliberately depends on `tramaj-purs`, not `tramaj-halogen` — this
  # CLI never folds to Halogen output, only to the normative `Node` JSON
  # via `Tramaj.Node.nodeToJson`.
  dependencies:
    - prelude
    - argonaut-core
    - arrays
    - console
    - effect
    - either
    - integers
    - maybe
    - node-fs
    - node-process
    - ordered-collections
    - strings
    - tramaj-purs
    - tuples
    - foreign-object
  test:
    main: Test.Cli.Main
    dependencies:
      - exceptions
  run:
    main: Main
