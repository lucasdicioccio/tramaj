package:
  name: tramaj-cli
  # Deliberately depends on `tramaj`, not `tramaj-halogen` — this
  # CLI never folds to Halogen output, only to the normative `Node` JSON
  # via `Tramaj.Node.nodeToJson`.
  dependencies:
    - prelude
    - argonaut-core
    - console
    - effect
    - node-fs
    - node-process
    - strings
    - tramaj
  run:
    main: Main
