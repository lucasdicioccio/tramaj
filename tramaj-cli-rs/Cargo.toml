[package]
name = "tramaj-cli-rs"
version = "0.1.0"
edition = "2021"
description = "Standalone CLI over the tramaj-rs crate's parser/eval/analysis core. Rust port of tramaj-cli's Main.purs."
authors = ["Lucas DiCioccio <lucas.dicioccio@gmail.com>"]
license = "MIT"
repository = "https://github.com/lucasdicioccio/templating-lang"

[[bin]]
name = "tramaj-cli-rs"
path = "src/main.rs"

[dependencies]
tramaj-rs = { path = "../tramaj-rs" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
