name: CI

# Automatic runs are switched off for now to save GitHub Actions credit;
# every job is kept so it can be run by hand from the Actions tab
# ("Run workflow") and re-enabled all at once later by restoring
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  purescript:
    name: PureScript (tramaj, tramaj-halogen, tramaj-cli, playground)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PureScript and Spago
        run: npm install -g purescript@0.15.15 spago@0.93.43

      # esbuild, which `spago bundle` shells out to. Comes from the
      # workspace root's package.json rather than a global install, so the
      # version CI bundles with is the one committed in package-lock.json.
      - name: Install JS build tooling
        run: |
          npm ci
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Cache spago artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/spago-nodejs
            .spago
            output
          key: ${{ runner.os }}-spago-${{ hashFiles('spago.lock') }}

      - name: Build all packages
        run: spago build

      # The fixture suite lives in `tramaj`; tramaj-halogen, tramaj-cli and
      # playground have no tests of their own, so `spago build` above is the
      # only check they get.
      - name: Test
        run: spago test -p tramaj

      - name: Bundle the playground
        run: spago bundle -p tramaj-playground

      - name: Bundle the CLI and render a template
        run: |
          # --outfile is resolved relative to the package directory
          spago bundle -p tramaj-cli --platform node \
            --outfile dist/tramaj-cli.js
          printf '@n=cardinality($ctx.items)\n.p("there are `$n` item(s)")' > /tmp/t.tmpl
          printf '{"items":["a","b","c"]}' > /tmp/t.json
          node tramaj-cli/dist/tramaj-cli.js /tmp/t.tmpl /tmp/t.json

  haskell:
    name: Haskell (tramaj-hs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.12.1.0"

      - name: Cache cabal store
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}

      - name: cabal update
        run: cabal update

      # --enable-tests on both steps: without it the solver plans the
      # library alone and `cabal test` refuses (Cabal-7043).
      - name: Build
        run: cabal build all --enable-tests

      - name: Test
        run: cabal test unit --enable-tests

  python:
    name: Python (tramaj-py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only: no install step. The corpus runner walks up
      # from tramaj-py/tests to the repository's corpus/cases.
      - name: Test
        run: python3 -m unittest discover -s tests
        working-directory: tramaj-py

      - name: Render a template
        run: |
          printf '@n=cardinality($ctx.items)\n.p("there are `$n` item(s)")' > /tmp/t.tramaj
          printf '{"items":["a","b","c"]}' > /tmp/t.json
          python3 -m tramaj /tmp/t.tramaj /tmp/t.json
        working-directory: tramaj-py
