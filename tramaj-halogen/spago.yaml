package:
  name: tramaj-halogen
  # `tramaj-purs` is the halogen-free parser/eval core this package folds
  # into real Halogen output; it resolves as a workspace-local package
  # (see the root spago.yaml). Split out of `tramaj-purs` itself on
  # 2026-07-20 so the core carries no halogen dependency and stays
  # consumable by non-browser hosts such as `tramaj-cli`.
  dependencies:
    - prelude
    - argonaut-core
    - arrays
    - integers
    - maybe
    - ordered-collections
    - strings
    - tuples
    - halogen
    - tramaj-purs
  publish:
    # Aligned with tramaj-hs (0.3.0.0); v0.1.0 predates the rename.
    version: 0.3.0
    license: MIT
    location:
      githubOwner: lucasdicioccio
      githubRepo: tramaj
      subdir: tramaj-halogen
